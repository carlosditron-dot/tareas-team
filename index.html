<style id="css">
/* Layout: calendario continuo y denso para iPad; arriba filtros y prioridades del día; panel fijo a la derecha para la tarea, el dictado y las sugerencias. En pantallas angostas pasa a agenda por día. */
:root{
  --bg:#F6F7F2; --card:#FFFFFF; --ink:#18221D; --muted:#5E6B64; --line:#DCE2DA; --soft:#EEF1EA; --accent:#0E6B57; --accentInk:#FFFFFF; --today:#FFF3B0; --danger:#B4382B;
  --a-founders:#B7790B; --a-adsf:#0A8FA8; --a-anuncios:#2F55C8; --a-grupos:#1D8A4A; --a-contenido:#8146B0; --a-skool:#0A7B6C; --a-clase:#D1531F; --a-carrito:#C0322E; --a-season:#C2357E; --a-reto:#9A7A00; --a-equipo:#4C6A87; --a-agenda:#7D8780; --a-l2:#5A6470;
  --c-carlos:#0E6B57; --c-nakari:#C2357E; --p1:#D7263D; --p2:#E8790C; --p3:#C9A100;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --card:#18201C; --ink:#E6EEE8; --muted:#9AAAA1; --line:#2A3630; --soft:#1E2823; --accent:#4FCBA6; --accentInk:#06231D; --today:#3A3416; --danger:#F08B78;
  --a-founders:#E3AC3C; --a-adsf:#4FD1E6; --a-anuncios:#86A0F5; --a-grupos:#5FCB8C; --a-contenido:#C39BE6; --a-skool:#4FCBB8; --a-clase:#F29A6B; --a-carrito:#F08B78; --a-season:#EE8BC0; --a-reto:#E0C24A; --a-equipo:#94B2CF; --a-agenda:#A3ADA7; --a-l2:#A4AEBA;
  --c-carlos:#4FCBA6; --c-nakari:#EE8BC0; --p1:#FF6B7D; --p2:#FFA552; --p3:#F0CF4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --card:#18201C; --ink:#E6EEE8; --muted:#9AAAA1; --line:#2A3630; --soft:#1E2823; --accent:#4FCBA6; --accentInk:#06231D; --today:#3A3416; --danger:#F08B78;
  --a-founders:#E3AC3C; --a-adsf:#4FD1E6; --a-anuncios:#86A0F5; --a-grupos:#5FCB8C; --a-contenido:#C39BE6; --a-skool:#4FCBB8; --a-clase:#F29A6B; --a-carrito:#F08B78; --a-season:#EE8BC0; --a-reto:#E0C24A; --a-equipo:#94B2CF; --a-agenda:#A3ADA7; --a-l2:#A4AEBA;
  --c-carlos:#4FCBA6; --c-nakari:#EE8BC0; --p1:#FF6B7D; --p2:#FFA552; --p3:#F0CF4A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 13px/1.35 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.con-panel .wrap{padding-right:362px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font:700 22px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.mes{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:700}
.btn.peligro{border-color:var(--danger);color:var(--danger)}
.btn.peligro.solid{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.estado{font-size:11.5px;color:var(--muted)}

.filtros{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:6px 0 8px}

.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 9px 3px 7px;cursor:pointer;font-size:11.5px;-webkit-user-select:none;user-select:none}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.38}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.ayuda{font-size:11.5px;color:var(--muted);margin:0}

.pcol>b{font-size:11.5px;color:var(--muted)}

.pslot .t{flex:1}
.pslot .vacio{font-size:11.5px;color:var(--muted)}

.pb.p1{--pcol:var(--p1)}.pb.p2{--pcol:var(--p2)}.pb.p3{--pcol:var(--p3)}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px}
.dows,.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dows{position:sticky;top:0;z-index:3;background:var(--card);border-radius:12px 12px 0 0}

.banda{grid-column:1/-1;padding:7px 8px 5px;font:700 14px/1.1 var(--f-display);text-transform:capitalize;background:var(--soft);border-bottom:1px solid var(--line)}
.banda-m{margin:6px 0 0;font:700 15px/1.1 var(--f-display);text-transform:capitalize}
.dia{min-height:64px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 3px 5px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.dia.sab{border-right:0}
.dia.hoy{background:var(--today)}
.dia.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dia.destino,.grupo.destino,.dcol.destino,.col.destino,.vchk.destino,.tab-dia.destino{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.num{font:500 11px/1 var(--f-mono);color:var(--muted);padding:2px 3px 3px;display:flex;justify-content:space-between;gap:4px}
.num .m1{color:var(--accent);font-weight:700;text-transform:uppercase}
.hoy .num b{color:var(--ink)}
.num small{font-size:10px;color:var(--muted)}
.mas-semanas{display:block;margin:8px auto}
#marco{position:relative;overflow:hidden}
#vista{transform-origin:0 0}
.t{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;min-width:0;padding:1px 4px 1px 5px;border-radius:4px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);cursor:pointer;font-size:11px;line-height:1.3;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.t:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.t.prio{box-shadow:inset 0 0 0 1.5px var(--pcol)}
.t .m{display:flex;justify-content:space-between;align-items:center;gap:4px}
.t .m span:last-child{display:flex;gap:3px;align-items:center}
.t .h{font:500 9.5px/1.3 var(--f-mono);color:var(--muted);flex:none}
.t .n{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;min-width:0;flex:1}
.t .p{flex:none;font:700 9px/1 var(--f-mono);color:var(--pc);border:1px solid var(--pc);border-radius:3px;padding:1px 2px}
.t .pb{font-size:8.5px;padding:2px 3px}
.t.listo{opacity:.4}
.t.listo .n{text-decoration:line-through}
.t.hito .n{font-weight:700}
.t.tent .n{font-style:italic}
.t.arrastrando,.tc.arrastrando,.dr.arrastrando{opacity:.25}
.tc.sobre,.dr.sobre{box-shadow:0 -3px 0 0 var(--accent)}
.fantasma{position:fixed;z-index:50;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);background:var(--card)!important;opacity:.95;transform:rotate(-2deg)}
.agenda{display:grid;gap:8px}
.agenda .grupo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:3px}
.agenda .grupo.hoy{background:var(--today)}
.agenda h3{margin:0 0 3px;font:700 13px/1.2 var(--f-display);text-transform:capitalize}
.agenda .t,.lista .t,.pslot .t{font-size:12.5px;padding:3px 6px}
.agenda .t .n,.lista .t .n{-webkit-line-clamp:unset;display:block}
.panel{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;width:340px;max-width:calc(100vw - 20px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:0 10px 40px rgba(0,0,0,.16);transform-origin:0 0}
.panel[hidden]{display:none}
.panel>*{flex:none}
.panel h2{margin:0;font:700 16px/1.2 var(--f-display)}

.fila{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.botones{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.lista{display:grid;gap:4px}
.det{display:grid;gap:8px}
.det h3{margin:0;font:700 15px/1.3 var(--f-body)}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:12.5px}
.det dt{color:var(--muted)}
.det dd{margin:0}
.det .nota{background:var(--soft);border-radius:8px;padding:8px;font-size:12.5px;white-space:pre-wrap}
.det a{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px}
.pill i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.prio-btns{display:flex;gap:4px;align-items:center}
.prio-btns button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 8px;cursor:pointer;font:700 11px/1 var(--f-mono)}
.prio-btns button[aria-pressed="true"]{background:var(--pcol);border-color:var(--pcol);color:#fff}
.prio-btns .p1{--pcol:var(--p1)}.prio-btns .p2{--pcol:var(--p2)}.prio-btns .p3{--pcol:var(--p3)}
.confirmar{border:1px solid var(--danger);border-radius:8px;padding:8px;display:grid;gap:6px;font-size:12.5px}
.atajos{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.atajos kbd{font:500 10.5px/1 var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:1px 4px;background:var(--soft)}
.dictado{display:grid;gap:8px}
.dictado label{font-size:12px;color:var(--muted);font-weight:700}
.dictado textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg);font-size:14px}
.borrador{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:8px;display:grid;gap:6px;background:var(--bg)}

.borrador .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.borrador .g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.borrador label{display:grid;gap:2px;font-size:11px;color:var(--muted)}
.borrador .quitar{justify-self:end;font-size:11.5px}
.sug{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px;display:grid;gap:6px;background:var(--bg)}
.sug.nota{border-left-color:var(--muted)}
.sug h4{margin:0;font:700 13px/1.3 var(--f-body)}
.sug p{margin:0;font-size:12px;color:var(--muted)}
.sug ul{margin:0;padding-left:16px;font-size:11.5px}
.sug.hecha{opacity:.45}
.msg{font-size:12px;border-radius:8px;padding:7px 9px;background:var(--soft)}
.msg.err{color:var(--danger)}
.vacio{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;display:flex;gap:12px;align-items:center;font-size:12.5px;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline}
/* Tablero: columnas por categoría o por día, tarjetas tipo checklist ordenadas por prioridad */
.tab-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.tab-dias{display:flex;flex-wrap:wrap;gap:5px;align-items:center;width:100%;padding:4px 0 2px}
.tab-dia{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;cursor:pointer;font:500 11.5px/1.2 var(--f-mono);display:inline-flex;align-items:center;gap:5px;-webkit-user-select:none;user-select:none}
.tab-dia.hoy{background:var(--today);color:var(--ink);font-weight:700}
.tab-dia[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:700}
.tab-dia small{opacity:.75;font-size:10px}
.tablero{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;align-items:flex-start;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-gutter:stable}
.col{flex:0 0 280px;background:color-mix(in srgb,var(--k) 8%,var(--card));border:1px solid var(--line);border-top:5px solid var(--k);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:7px;max-height:calc(100vh - 170px);overflow-y:auto}

.tc:active{cursor:grabbing}
.tc.urg{border:2px dashed var(--danger);border-bottom:5px solid var(--k)}
.tc.listo{opacity:.5}
.tc.listo .tn{text-decoration:line-through}
.chk{all:unset;box-sizing:border-box;cursor:pointer;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font:700 13px/1 var(--f-body);color:var(--accentInk)}
.chk[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tcb{all:unset;cursor:grab;display:grid;gap:5px;min-width:0}
.tn{font-size:12.5px;line-height:1.32;word-break:break-word}
.tm{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;font:500 10.5px/1.3 var(--f-mono);color:var(--muted)}
.tm .u{color:var(--danger);font-weight:700}
.tm .pq{font:700 9.5px/1 var(--f-mono);border-radius:4px;padding:2px 4px;color:#fff;background:var(--pc)}
.nump{font:700 17px/1 var(--f-display);color:var(--muted);min-width:20px;text-align:right;padding-top:2px}
.tc.urg .nump{color:var(--danger)}
.sep-listas{font:700 11px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 2px 0}
/* Vista Día: columnas de ayer, hoy y mañana (o semana) como checklist con scroll horizontal y drag & drop */
.dv-top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px}
.dv-top .seg button{font-size:15px;padding:4px 12px}

.dr.listo{opacity:.5}

.dr.sel{box-shadow:0 0 0 2px var(--accent)}

.dh .q{font:700 9.5px/1 var(--f-mono);border-radius:4px;padding:2px 4px;color:#fff;background:var(--pc)}

@media (prefers-reduced-motion:no-preference){.t{transition:background .12s}}

  arr.x=x; arr.y=y; arr.f.style.left=(x/z-arr.dx)+"px"; arr.f.style.top=(y/z-arr.dy)+"px";
  arr.vy=y<70?-10:(y>window.innerHeight-70?10:0);
  var hCont=document.querySelector(vistaModo==="tablero"?".tablero":vistaModo==="dia"?".dcols":"");
  if(hCont){
    var cr=hCont.getBoundingClientRect();
    arr.vx=x<cr.left+80?-14:(x>cr.right-80?14:0);
  } else arr.vx=0;
  marcarDestino(destinoEn(x,y),tarjetaSobreEn(x,y));
}
function terminarArrastre(x,y,soltar){
  var a=arr; arr=null; if(!a) return; clearTimeout(a.timer); if(!a.activo) return;
  clearInterval(a.scroll); a.f.remove(); a.el.classList.remove("arrastrando");
  var cel=soltar?destinoEn(x,y):null, tar=soltar?tarjetaSobreEn(x,y):null;
  marcarDestino(null,null);
  suprimirClick=true; setTimeout(function(){suprimirClick=false;},350);
  if(!cel) return;
  var t=buscar(a.id); if(!t) return;
  var diaDest=cel.dataset.dropDia||cel.dataset.dia;
  var colDest=cel.dataset.dropCol;
  if(diaDest){
    var nuevoDia=a.diaChip&&t.dia?sumarDias(t.dia,difDias(a.diaChip,diaDest)):diaDest;
    if(t.dia!==nuevoDia){
      if(tar) reordenarEnContenedor(a.id,tar.dataset.id,cel,true);
      moverTarea(a.id,nuevoDia);
      return;
    }
    if(tar) reordenarEnContenedor(a.id,tar.dataset.id,cel,false);
  } else if(colDest){
    var actualCol=colDe(t)[0];
    if(actualCol!==colDest){
      if(tar) reordenarEnContenedor(a.id,tar.dataset.id,cel,true);
      cambiarColumnaTarea(a.id,colDest);
      return;
    }
    if(tar) reordenarEnContenedor(a.id,tar.dataset.id,cel,false);
  }
}
document.addEventListener("pointerdown",function(ev){
  if(pinch||ev.isPrimary===false||ev.button>0) return;
  if(ev.target.closest(".chk")) return;
  var el=ev.target.closest("#vista .t[data-id], #prios .t[data-id], #panel .lista .t[data-id], #tablero .tc[data-id], #diavista .dr[data-id]");
  if(!el) return;
  var celda=el.closest("[data-drop-dia],[data-dia]"), t=buscar(el.dataset.id);
  var diaChip=celda?(celda.dataset.dropDia||celda.dataset.dia):(el.dataset.dia||(t&&t.dia)||null);
  var enVista=!!el.closest("#vista");
  arr={id:el.dataset.id,el:el,diaChip:diaChip,z:enVista?zoom:1,x0:ev.clientX,y0:ev.clientY,activo:false,raton:ev.pointerType==="mouse"};
  if(!arr.raton) arr.timer=setTimeout(function(){if(arr)iniciarArrastre(arr.x0,arr.y0);},380);
});
document.addEventListener("pointermove",function(ev){
  if(!arr) return;
  if(!arr.activo){
    var mov=Math.hypot(ev.clientX-arr.x0,ev.clientY-arr.y0);
    if(arr.raton){if(mov>6) iniciarArrastre(ev.clientX,ev.clientY);}
    else if(mov>10){clearTimeout(arr.timer);arr=null;}
    return;
  }
  ev.preventDefault(); moverFantasma(ev.clientX,ev.clientY);
});
document.addEventListener("pointerup",function(ev){terminarArrastre(ev.clientX,ev.clientY,true);});
document.addEventListener("pointercancel",function(){terminarArrastre(0,0,false);});
document.addEventListener("contextmenu",function(ev){if(ev.target.closest(".t,.tc,.dr")) ev.preventDefault();});

/* ---------- scroll horizontal con la rueda horizontal del ratón (o Shift + rueda) en Tablero y Día ---------- */
document.addEventListener("wheel",function(ev){
  var cont=ev.target.closest(".tablero,.dcols");
  if(!cont) return;
  var dx=ev.deltaX, dy=ev.deltaY;
  if(ev.shiftKey&&dx===0&&dy!==0){dx=dy;dy=0;}
  if(dx!==0){
    var factor=ev.deltaMode===1?36:ev.deltaMode===2?cont.clientWidth:1;
    cont.scrollLeft+=dx*factor;
    if(Math.abs(dx)>=Math.abs(dy)) ev.preventDefault();
  }
},{passive:false});

/* ---------- zoom con dos dedos: te acercas a los días; el panel no se mueve ---------- */
function distTouch(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
function centro(a,b){return [(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2];}
document.addEventListener("touchstart",function(ev){if(ev.touches.length===2){if(arr){clearTimeout(arr.timer);terminarArrastre(0,0,false);arr=null;}var c0=centro(ev.touches[0],ev.touches[1]);pinch={d0:distTouch(ev.touches[0],ev.touches[1]),z0:zoom,cx:c0[0],cy:c0[1]};}},{passive:true});
document.addEventListener("touchmove",function(ev){
  if(arr&&arr.activo){ev.preventDefault();return;}
  if(pinch&&ev.touches.length===2){
    ev.preventDefault();
    var c1=centro(ev.touches[0],ev.touches[1]);
    window.scrollBy(pinch.cx-c1[0],pinch.cy-c1[1]); pinch.cx=c1[0]; pinch.cy=c1[1];
    zoomEn(pinch.z0*distTouch(ev.touches[0],ev.touches[1])/pinch.d0,c1[0],c1[1]);
  }
},{passive:false});
document.addEventListener("touchend",function(ev){if(pinch&&ev.touches.length<2){pinch=null;guardarFiltros();}});
["gesturestart","gesturechange"].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});

/* ---------- panel anclado a lo que se ve (cuando la página se abre sola) ---------- */
function anclarPanel(){
  var el=document.getElementById("panel"), vv=window.visualViewport; if(!el) return;
  if(!vv||el.hidden||Math.abs(vv.scale-1)<0.02){["transform","left","top","right","bottom","width","height"].forEach(function(k){el.style[k]="";});return;}
  var s=vv.scale, m=10, w=Math.min(340,vv.width*s-2*m);
  el.style.left="0"; el.style.top="0"; el.style.right="auto"; el.style.bottom="auto"; el.style.width=w+"px"; el.style.height=(vv.height*s-2*m)+"px";
  el.style.transform="translate("+(vv.offsetLeft+vv.width-(w+m)/s)+"px,"+(vv.offsetTop+m/s)+"px) scale("+(1/s)+")";
}
if(window.visualViewport){window.visualViewport.addEventListener("resize",anclarPanel);window.visualViewport.addEventListener("scroll",anclarPanel);}
